<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日工作任务记录</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --border: #e3e5e8;
    --text: #24292f; --muted: #6b7280; --primary: #2563eb;
    --primary-hover: #1d4ed8; --danger: #dc2626;
    --warn-bg: #fff8d6; --warn-border: #f0d264;
    --ok: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d; --card: #1f2229; --border: #33363e;
      --text: #e6e8eb; --muted: #9aa0aa;
      --warn-bg: #3a3320; --warn-border: #8a7627;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  .container { max-width: 1500px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .tabs { display: flex; gap: 6px; }
  .tab { border: 1px solid var(--border); background: var(--card); color: var(--muted); }
  .tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  h1 { font-size: 20px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  button, select, input[type="text"], input[type="date"], input[type="search"], textarea {
    font: inherit; color: var(--text); background: var(--card);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px;
  }
  button { cursor: pointer; }
  button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  button.primary:hover { background: var(--primary-hover); }
  button.ghost:hover { border-color: var(--primary); color: var(--primary); }
  button.danger-link { border: none; background: none; color: var(--danger); cursor: pointer; padding: 2px 6px; }
  .toolbar input[type="search"] { width: 200px; }
  .stats { color: var(--muted); font-size: 13px; margin-left: auto; }
  .stats b.undone { color: #b45309; }
  /* 列设置下拉 */
  .colpick { position: relative; }
  .colpick summary { list-style: none; cursor: pointer; border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; background: var(--card); color: var(--text); white-space: nowrap; }
  .colpick summary::-webkit-details-marker { display: none; }
  .colpick[open] summary { border-color: var(--primary); color: var(--primary); }
  .colpick .menu { position: absolute; top: calc(100% + 4px); left: 0; z-index: 5; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; box-shadow: 0 4px 14px rgba(0,0,0,.18); display: grid; gap: 5px; min-width: 130px; }
  .colpick .menu label { display: flex; align-items: center; gap: 6px; margin: 0; color: var(--text); font-size: 13px; white-space: nowrap; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  th, td { border-bottom: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: var(--card); font-size: 13px; color: var(--muted); position: sticky; top: 0; white-space: nowrap; }
  td.seq { color: var(--muted); white-space: nowrap; }
  td.editable { cursor: text; }
  td.editable:hover { background: rgba(37,99,235,.06); }
  td .inline-input { width: 100%; min-width: 120px; font: inherit; }
  tr.undone td { background: var(--warn-bg); }
  tr.undone td:first-child { border-left: 3px solid var(--warn-border); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; white-space: nowrap; }
  .badge.t1 { background: #dbeafe; color: #1d4ed8; }
  .badge.t2 { background: #fee2e2; color: #b91c1c; }
  .badge.t3 { background: #dcfce7; color: #15803d; }
  .badge.t4 { background: #ede9fe; color: #6d28d9; }
  .badge.t5 { background: #ffedd5; color: #c2410c; }
  .badge.k1 { background: #cffafe; color: #0e7490; }
  .badge.k2 { background: #fce7f3; color: #be185d; }
  td .clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .badge.done { background: #dcfce7; color: #15803d; }
  .badge.undone { background: #fef3c7; color: #b45309; }
  .solved { color: var(--ok); white-space: nowrap; }
  .actions { white-space: nowrap; }
  .empty-tip { text-align: center; color: var(--muted); padding: 40px 0; }
  /* 模态框 */
  .mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 10; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow: auto; }
  .mask.show { display: flex; }
  .modal { background: var(--card); border-radius: 10px; width: 620px; max-width: 100%; padding: 20px 22px; }
  .modal h2 { font-size: 16px; margin-bottom: 14px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .form-grid .full { grid-column: 1 / -1; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .form-grid input, .form-grid select, .form-grid textarea { width: 100%; }
  textarea { resize: vertical; min-height: 60px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  /* 附件 */
  .att-row { margin-top: 6px; }
  .att-add { padding: 3px 10px; font-size: 12px; }
  .att-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .att-chip { display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; font-size: 12px; background: var(--bg); max-width: 260px; }
  .att-chip img { width: 36px; height: 28px; object-fit: cover; border-radius: 3px; cursor: zoom-in; }
  .att-chip .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
  .att-chip a { color: var(--primary); text-decoration: none; }
  .att-chip .rm { cursor: pointer; color: var(--danger); padding: 0 2px; border: none; background: none; font-size: 13px; }
  .paperclip { color: var(--primary); cursor: pointer; font-size: 12px; margin-left: 6px; white-space: nowrap; }
  /* 详情弹窗 */
  .view-grid { display: grid; grid-template-columns: 96px 1fr; gap: 8px 12px; font-size: 13px; }
  .view-grid .k { color: var(--muted); white-space: nowrap; }
  .view-grid .v { white-space: pre-wrap; word-break: break-word; }
  .view-att { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .view-att img { width: 110px; height: 84px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); cursor: zoom-in; }
  /* 图片大图预览 */
  #lightbox { display: none; position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.82); align-items: center; justify-content: center; cursor: zoom-out; }
  #lightbox.show { display: flex; }
  #lightbox img { max-width: 92vw; max-height: 92vh; border-radius: 6px; }
  .sync-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0 4px; font-size: 13px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.ok { background: var(--ok); } .dot.err { background: var(--danger); }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📋 工作任务 & 客户上线</h1>
    <div class="tabs">
      <button id="tabTask" class="tab active" onclick="switchPage('task')">工作任务</button>
      <button id="tabGo" class="tab" onclick="switchPage('go')">客户上线</button>
      <button id="tabKb" class="tab" onclick="switchPage('kb')">知识库</button>
    </div>
    <button class="ghost" onclick="openSettings()">⚙ 设置</button>
  </header>

  <div id="pageTask">
  <div class="toolbar">
    <button class="primary" onclick="openEdit()">＋ 新增任务</button>
    <select id="filterType" onchange="render()">
      <option value="">全部类型</option>
    </select>
    <select id="filterStatus" onchange="render()">
      <option value="">全部状态</option>
      <option>未解决</option>
      <option>已完成</option>
    </select>
    <select id="filterCustomer" onchange="render()">
      <option value="">全部客户</option>
    </select>
    <select id="filterHandler" onchange="render()">
      <option value="">全部处理人</option>
    </select>
    <input type="date" id="filterDate" onchange="render()" title="按提出日期筛选">
    <input type="search" id="kw" placeholder="搜索关键词…" oninput="render()">
    <button class="ghost" onclick="resetFilters()">重置筛选</button>
    <details class="colpick" id="colPick">
      <summary>显示列 ▾</summary>
      <div class="menu" id="colMenu"></div>
    </details>
    <button class="ghost" onclick="exportCsv()">导出 CSV</button>
    <button class="ghost" onclick="exportJson()">导出 JSON</button>
    <label class="ghost" style="cursor:pointer;border:1px solid var(--border);border-radius:6px;padding:6px 10px;">
      导入 JSON<input type="file" accept=".json" style="display:none" onchange="importJson(this)">
    </label>
    <div class="stats" id="stats"></div>
  </div>

  <div class="sync-bar">
    <span class="dot" id="syncDot"></span><span id="syncText">本地模式（未配置 GitHub）</span>
    <button class="ghost" style="padding:2px 8px;font-size:12px;" onclick="pullFromGitHub()">从 GitHub 拉取</button>
    <button class="ghost" style="padding:2px 8px;font-size:12px;" onclick="pushToGitHub()">保存到 GitHub</button>
  </div>

  <table>
    <thead>
      <tr id="theadRow"></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div><!-- /pageTask -->

<div id="pageGo" style="display:none">
  <div class="toolbar">
    <button class="primary" onclick="openGoEdit()">＋ 新增上线记录</button>
    <select id="goFilterMode" onchange="render()">
      <option value="">全部直联模式</option>
    </select>
    <input type="search" id="goKw" placeholder="搜索企业 / 银行 / 城市…" oninput="render()">
    <label class="ghost" style="cursor:pointer;border:1px solid var(--border);border-radius:6px;padding:6px 10px;">
      📥 导入 Excel<input type="file" accept=".xlsx,.xls" style="display:none" onchange="importGoExcel(this)">
    </label>
    <button class="ghost" onclick="exportGoCsv()">导出 CSV</button>
    <div class="stats" id="goStats"></div>
  </div>

  <div class="sync-bar">
    <span class="dot" id="goSyncDot"></span><span id="goSyncText">本地模式（未配置 GitHub）</span>
    <button class="ghost" style="padding:2px 8px;font-size:12px;" onclick="pullFromGitHub()">从 GitHub 拉取</button>
    <button class="ghost" style="padding:2px 8px;font-size:12px;" onclick="pushToGitHub()">保存到 GitHub</button>
  </div>

  <table>
    <thead>
      <tr id="goTheadRow"></tr>
    </thead>
    <tbody id="goTbody"></tbody>
  </table>
</div><!-- /pageGo -->

<div id="pageKb" style="display:none">
  <div class="toolbar">
    <button class="primary" onclick="openKbEdit()">＋ 新增知识条目</button>
    <select id="kbFilterCat" onchange="render()">
      <option value="">全部分类</option>
      <option>云跨行FAQ</option>
      <option>ERP对接</option>
    </select>
    <input type="search" id="kbKw" placeholder="搜索标题 / 内容…" oninput="render()">
    <button class="ghost" onclick="exportKbCsv()">导出 CSV</button>
    <div class="stats" id="kbStats"></div>
  </div>

  <div class="sync-bar">
    <span class="dot" id="kbSyncDot"></span><span id="kbSyncText">本地模式（未配置 GitHub）</span>
    <button class="ghost" style="padding:2px 8px;font-size:12px;" onclick="pullFromGitHub()">从 GitHub 拉取</button>
    <button class="ghost" style="padding:2px 8px;font-size:12px;" onclick="pushToGitHub()">保存到 GitHub</button>
  </div>

  <table>
    <thead>
      <tr id="kbTheadRow"></tr>
    </thead>
    <tbody id="kbTbody"></tbody>
  </table>
</div><!-- /pageKb -->
</div>

<!-- 新增/编辑 模态框 -->
<div class="mask" id="editMask">
  <div class="modal">
    <h2 id="editTitle">新增任务</h2>
    <div class="form-grid">
      <div><label>任务提出日期 *</label><input type="date" id="fDate"></div>
      <div><label>任务类型 *</label><select id="fType"></select></div>
      <div class="full"><label>客户名称</label><input type="text" id="fCustomer" list="customerList" placeholder="输入或从下拉选择（双击表格也可改）"><datalist id="customerList"></datalist></div>
      <div class="full"><label>任务描述 *</label><textarea id="fDesc" placeholder="做了什么 / 遇到什么问题"></textarea>
        <div class="att-row" data-att="desc"><button type="button" class="ghost att-add" onclick="pickAtt('desc')">📎 添加截图/文件</button><input type="file" id="attFile-desc" multiple style="display:none" onchange="addAtt('desc', this)"><div class="att-list" id="attList-desc"></div></div>
      </div>
      <div class="full"><label>问题原因</label><textarea id="fCause"></textarea>
        <div class="att-row" data-att="cause"><button type="button" class="ghost att-add" onclick="pickAtt('cause')">📎 添加截图/文件</button><input type="file" id="attFile-cause" multiple style="display:none" onchange="addAtt('cause', this)"><div class="att-list" id="attList-cause"></div></div>
      </div>
      <div class="full"><label>解决方案</label><textarea id="fSolution"></textarea>
        <div class="att-row" data-att="solution"><button type="button" class="ghost att-add" onclick="pickAtt('solution')">📎 添加截图/文件</button><input type="file" id="attFile-solution" multiple style="display:none" onchange="addAtt('solution', this)"><div class="att-list" id="attList-solution"></div></div>
      </div>
      <div><label>解决日期（完成后填写）</label><input type="date" id="fSolved"></div>
      <div><label>任务状态</label><select id="fStatus"><option>未解决</option><option>已完成</option></select></div>
      <div><label>处理人</label><input type="text" id="fHandler" list="handlerList" placeholder="输入或从下拉选择"></div>
      <div class="full"><label>备注</label><input type="text" id="fNote"></div>
      <datalist id="handlerList"></datalist>
    </div>
    <div class="modal-foot">
      <button onclick="closeEdit()">取消</button>
      <button class="primary" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<!-- 详情 模态框 -->
<div class="mask" id="viewMask">
  <div class="modal">
    <h2 id="viewTitle">任务详情</h2>
    <div class="view-grid" id="viewBody"></div>
    <div class="modal-foot">
      <button onclick="closeView()">关闭</button>
      <button class="primary" id="viewEditBtn" onclick="closeView(); openEdit(viewingSeq)">编辑这条</button>
    </div>
  </div>
</div>

<!-- 图片大图预览 -->
<div id="lightbox" onclick="this.classList.remove('show')"><img id="lightboxImg" alt=""></div>

<!-- 上线记录 新增/编辑 模态框 -->
<div class="mask" id="goMask">
  <div class="modal">
    <h2 id="goEditTitle">新增上线记录</h2>
    <div class="form-grid">
      <div><label>企业名称 *</label><input type="text" id="gEnt"></div>
      <div><label>银行名称</label><input type="text" id="gBank"></div>
      <div><label>直联模式</label><select id="gMode"></select></div>
      <div><label>上线日期</label><input type="date" id="gDate"></div>
      <div><label>城市</label><input type="text" id="gCity"></div>
      <div><label>实施人员</label><input type="text" id="gImpl" placeholder="多人用顿号或逗号分隔"></div>
      <div class="full"><label>客户经理</label><input type="text" id="gMgr" placeholder="多人用顿号或逗号分隔"></div>
    </div>
    <div class="modal-foot">
      <button onclick="closeGoEdit()">取消</button>
      <button class="primary" onclick="saveGoEdit()">保存</button>
    </div>
  </div>
</div>

<!-- 知识库 新增/编辑 模态框 -->
<div class="mask" id="kbMask">
  <div class="modal" style="width:720px">
    <h2 id="kbEditTitle">新增知识条目</h2>
    <div class="form-grid">
      <div><label>分类 *</label><select id="kCat"><option>云跨行FAQ</option><option>ERP对接</option></select></div>
      <div><label>记录日期</label><input type="date" id="kDate"></div>
      <div class="full"><label>标题 / 问题 *</label><input type="text" id="kTitle" placeholder="如：云跨行余额查询返回为空怎么排查"></div>
      <div class="full"><label>内容 / 解决办法</label><textarea id="kContent" style="min-height:140px" placeholder="现象、原因、处理步骤、注意事项…"></textarea></div>
      <div class="full"><label>备注</label><input type="text" id="kNote"></div>
    </div>
    <div class="modal-foot">
      <button onclick="closeKbEdit()">取消</button>
      <button class="primary" onclick="saveKbEdit()">保存</button>
    </div>
  </div>
</div>

<!-- 知识库 详情 模态框 -->
<div class="mask" id="kbViewMask">
  <div class="modal" style="width:720px">
    <h2 id="kbViewTitle">知识条目</h2>
    <div class="view-grid" id="kbViewBody"></div>
    <div class="modal-foot">
      <button onclick="closeKbView()">关闭</button>
      <button class="primary" onclick="closeKbView(); openKbEdit(kbViewingSeq)">编辑这条</button>
    </div>
  </div>
</div>

<!-- 设置 模态框 -->
<div class="mask" id="setMask">
  <div class="modal">
    <h2>设置</h2>
    <div class="form-grid">
      <div class="full"><label>GitHub 仓库（如 xijun1115/work-log）</label><input type="text" id="sRepo" placeholder="owner/repo"></div>
      <div><label>分支</label><input type="text" id="sBranch" value="main"></div>
      <div><label>任务数据文件路径</label><input type="text" id="sPath" value="data/tasks.json"></div>
      <div class="full"><label>上线记录数据文件路径</label><input type="text" id="sGoPath" value="data/golive.json"></div>
      <div class="full"><label>知识库数据文件路径</label><input type="text" id="sKbPath" value="data/kb.json"></div>
      <div class="full"><label>GitHub Token（fine-grained，仅需该仓库 Contents 读写权限）</label>
        <input type="password" id="sToken" placeholder="github_pat_…">
        <div class="hint">Token 只保存在本浏览器 localStorage，不会上传。建议用 Fine-grained token，只勾选这一个仓库的 Contents: Read and write。</div>
      </div>
    </div>
    <div class="modal-foot">
      <button onclick="closeSettings()">关闭</button>
      <button class="primary" onclick="saveSettings()">保存设置</button>
    </div>
  </div>
</div>

<script>
const TYPES = ["他行直联测试", "生产问题", "业务需求", "云跨行上线", "他行直联上线"];
const CUSTOMER_PRESETS = ["吉邦精密", "中铁二十五局", "金发科技", "广晟财司", "广州农商行", "香山电子", "曼秀雷敦", "惠州大亚湾水务", "广州数科", "安保集团", "珠海交控", "广省智协", "广东太力", "佐登妮丝", "信银理财", "珠光汽车", "清远国投", "六盯目"];
const LS_KEY = "worklog_tasks_v1";
const LS_CFG = "worklog_gh_cfg_v1";
const LS_COLS = "worklog_cols_v1";
const GO_KEY = "worklog_golive_v1";
const KB_KEY = "worklog_kb_v1";
const KB_CATS = ["云跨行FAQ", "ERP对接"];
const MODES = ["前置机", "前置机（软证书）", "免前置", "openAPI", "sftp", "SDK", "三方"];
const GOCOLS = [
  { key: "ent",   label: "企业名称", w: "min-width:150px" },
  { key: "bank",  label: "银行名称", w: "min-width:120px" },
  { key: "mode",  label: "直联模式", w: "width:130px" },
  { key: "date",  label: "上线日期", w: "width:100px" },
  { key: "city",  label: "城市",     w: "width:90px" },
  { key: "impl",  label: "实施人员", w: "min-width:110px" },
  { key: "mgr",   label: "客户经理", w: "min-width:110px" },
];

/* 可配置显示的列（序号、操作始终显示） */
const COLS = [
  { key: "date",      label: "提出日期", w: "width:100px" },
  { key: "type",      label: "任务类型", w: "width:110px" },
  { key: "customer",  label: "客户名称", w: "width:110px" },
  { key: "desc",      label: "任务描述", w: "min-width:200px" },
  { key: "cause",     label: "问题原因", w: "min-width:160px" },
  { key: "solution",  label: "解决方案", w: "min-width:160px" },
  { key: "solvedDate",label: "解决日期", w: "width:100px" },
  { key: "status",    label: "状态",     w: "width:76px" },
  { key: "handler",   label: "处理人",   w: "width:90px" },
  { key: "note",      label: "备注",     w: "width:110px" },
];

let tasks = [];
let golive = [];
let kb = [];
let page = "task";   // task | go | kb
let editingId = null;
let visibleCols = new Set(COLS.map(c => c.key));
const D = () => page === "task" ? tasks : page === "go" ? golive : kb;

const PAGES = {
  task: { tab: "tabTask", body: "pageTask" },
  go:   { tab: "tabGo",   body: "pageGo" },
  kb:   { tab: "tabKb",   body: "pageKb" },
};

function switchPage(p) {
  page = p;
  for (const [key, ids] of Object.entries(PAGES)) {
    document.getElementById(ids.tab).classList.toggle("active", key === p);
    document.getElementById(ids.body).style.display = key === p ? "" : "none";
  }
  render();
}

function loadCols() {
  try {
    const saved = JSON.parse(localStorage.getItem(LS_COLS));
    if (Array.isArray(saved) && saved.length) visibleCols = new Set(saved.filter(k => COLS.some(c => c.key === k)));
  } catch {}
}
function saveCols() { localStorage.setItem(LS_COLS, JSON.stringify([...visibleCols])); }

/* ---------- 存取 ---------- */
function loadLocal() {
  try { tasks = JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch { tasks = []; }
  try { golive = JSON.parse(localStorage.getItem(GO_KEY)) || []; } catch { golive = []; }
  try { kb = JSON.parse(localStorage.getItem(KB_KEY)) || []; } catch { kb = []; }
}
function saveLocal() {
  localStorage.setItem(LS_KEY, JSON.stringify(tasks));
  localStorage.setItem(GO_KEY, JSON.stringify(golive));
  localStorage.setItem(KB_KEY, JSON.stringify(kb));
}
function cfg() {
  try { return JSON.parse(localStorage.getItem(LS_CFG)) || {}; } catch { return {}; }
}

/* ---------- GitHub 同步 ---------- */
function ghHeaders() {
  const c = cfg();
  return { "Authorization": "Bearer " + c.token, "Accept": "application/vnd.github+json" };
}
function ghUrl() {
  const c = cfg();
  const path = page === "task" ? (c.path || "data/tasks.json")
    : page === "go" ? (c.goPath || "data/golive.json")
    : (c.kbPath || "data/kb.json");
  return `https://api.github.com/repos/${c.repo}/contents/${path}`;
}
function b64encode(str) { return btoa(unescape(encodeURIComponent(str))); }
function b64decode(str) { return decodeURIComponent(escape(atob(str.replace(/\n/g, "")))); }

function setSync(state, text) {
  [["syncDot", "syncText"], ["goSyncDot", "goSyncText"], ["kbSyncDot", "kbSyncText"]].forEach(([d, t]) => {
    const de = document.getElementById(d);
    if (de) { de.className = "dot " + (state || ""); document.getElementById(t).textContent = text; }
  });
}

async function pullFromGitHub() {
  const c = cfg();
  if (!c.repo || !c.token) return alert("请先在「设置」里配置仓库和 Token");
  setSync("", "正在从 GitHub 拉取…");
  try {
    let r = await fetch(ghUrl() + "?ref=" + encodeURIComponent(c.branch || "main"), { headers: ghHeaders() });
    if (r.status === 404) { setSync("ok", "GitHub 上还没有数据文件，将创建新文件"); return; }
    if (!r.ok) {
      // 文件超过 1MB 时 Contents API 会拒绝，改用 raw 模式直接取内容
      r = await fetch(ghUrl() + "?ref=" + encodeURIComponent(c.branch || "main"),
        { headers: { ...ghHeaders(), "Accept": "application/vnd.github.raw" } });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const text = await r.text();
      var remote = JSON.parse(text);
    } else {
      const j = await r.json();
      var remote = JSON.parse(b64decode(j.content));
    }
    // 简单合并：按 seq 去重，本地没有的补进来
    const arr = D();
    const seqs = new Set(arr.map(t => t.seq));
    let added = 0;
    for (const t of remote) if (!seqs.has(t.seq)) { arr.push(t); added++; }
    arr.sort((a, b) => a.seq - b.seq);
    saveLocal(); render();
    setSync("ok", `拉取成功：远端 ${remote.length} 条，新增 ${added} 条`);
  } catch (e) { setSync("err", "拉取失败：" + e.message); }
}

async function pushToGitHub() {
  const c = cfg();
  if (!c.repo || !c.token) return alert("请先在「设置」里配置仓库和 Token");
  setSync("", "正在保存到 GitHub…");
  try {
    let sha;
    const r = await fetch(ghUrl() + "?ref=" + encodeURIComponent(c.branch || "main"), { headers: ghHeaders() });
    if (r.ok) sha = (await r.json()).sha;
    const body = {
      message: `worklog: 更新${page === "task" ? "任务" : page === "go" ? "上线" : "知识库"}记录 ` + new Date().toLocaleString("zh-CN"),
      content: b64encode(JSON.stringify(D(), null, 2)),
      branch: c.branch || "main",
    };
    if (sha) body.sha = sha;
    const p = await fetch(ghUrl(), { method: "PUT", headers: ghHeaders(), body: JSON.stringify(body) });
    if (!p.ok) throw new Error("HTTP " + p.status + " " + (await p.text()).slice(0, 120));
    setSync("ok", `已保存到 GitHub：${c.repo}（${D().length} 条）`);
  } catch (e) { setSync("err", "保存失败：" + e.message); }
}

/* ---------- 渲染 ---------- */
function typeBadge(t) {
  const i = TYPES.indexOf(t);
  return `<span class="badge t${i >= 0 ? i + 1 : 4}">${esc(t)}</span>`;
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m])); }

/* 状态：优先取显式 status 字段，老数据按解决日期推断 */
function statusOf(t) { return t.status || (t.solvedDate ? "已完成" : "未解决"); }
function statusBadge(t) {
  return statusOf(t) === "已完成"
    ? '<span class="badge done">已完成</span>'
    : '<span class="badge undone">未解决</span>';
}

function fillFilter(id, placeholder, values) {
  const sel = document.getElementById(id);
  const cur = sel.value;
  sel.innerHTML = `<option value="">${placeholder}</option>` +
    values.map(v => `<option${v === cur ? " selected" : ""}>${esc(v)}</option>`).join("");
}

/* 单元格渲染器：按列 key 输出 td */
const ATT_MARK = f => `<span class="paperclip" title="含附件">📎</span>`;
function cellHtml(t, key) {
  const dash = '<span style="color:var(--muted)">—</span>';
  const nl = s => esc(s).replace(/\n/g, "<br>");
  const clip = f => (t.att?.[f] || []).length ? ATT_MARK(f) : "";
  switch (key) {
    case "date":      return `<td>${t.date}</td>`;
    case "type":      return `<td>${typeBadge(t.type)}</td>`;
    case "customer":  return `<td class="editable" data-field="customer" title="双击编辑">${esc(t.customer) || dash}</td>`;
    case "desc":      return `<td class="editable" data-field="desc" title="双击编辑">${nl(t.desc)}${clip("desc")}</td>`;
    case "cause":     return `<td class="editable" data-field="cause" title="双击编辑">${nl(t.cause) || dash}${clip("cause")}</td>`;
    case "solution":  return `<td class="editable" data-field="solution" title="双击编辑">${nl(t.solution) || dash}${clip("solution")}</td>`;
    case "solvedDate":return `<td>${t.solvedDate ? `<span class="solved">✔ ${t.solvedDate}</span>` : dash}</td>`;
    case "status":    return `<td class="editable" data-field="status" title="双击切换状态">${statusBadge(t)}</td>`;
    case "handler":   return `<td class="editable" data-field="handler" title="双击编辑">${esc(t.handler) || dash}</td>`;
    case "note":      return `<td class="editable" data-field="note" title="双击编辑">${esc(t.note) || dash}</td>`;
  }
  return "<td></td>";
}

function buildColMenu() {
  document.getElementById("colMenu").innerHTML = COLS.map(c =>
    `<label><input type="checkbox" ${visibleCols.has(c.key) ? "checked" : ""} onchange="toggleCol('${c.key}', this.checked)">${c.label}</label>`
  ).join("");
}
function toggleCol(key, show) {
  show ? visibleCols.add(key) : visibleCols.delete(key);
  if (!visibleCols.size) visibleCols = new Set(["desc"]);  /* 至少留一列 */
  saveCols(); render(); buildColMenu();
}

function render() { page === "task" ? renderTask() : page === "go" ? renderGo() : renderKb(); }

function renderTask() {
  const ft = document.getElementById("filterType").value;
  const fs = document.getElementById("filterStatus").value;
  const fc = document.getElementById("filterCustomer").value;
  const fh = document.getElementById("filterHandler").value;
  const fd = document.getElementById("filterDate").value;
  const kw = document.getElementById("kw").value.trim().toLowerCase();
  const rows = tasks.filter(t => {
    if (ft && t.type !== ft) return false;
    if (fs && statusOf(t) !== fs) return false;
    if (fc && (t.customer || "") !== fc) return false;
    if (fh && (t.handler || "") !== fh) return false;
    if (fd && t.date !== fd) return false;
    if (kw && ![t.desc, t.cause, t.solution, t.note, t.customer, t.handler].join(" ").toLowerCase().includes(kw)) return false;
    return true;
  });
  const vis = COLS.filter(c => visibleCols.has(c.key));
  document.getElementById("theadRow").innerHTML =
    `<th style="width:46px">序号</th>` + vis.map(c => `<th style="${c.w}">${c.label}</th>`).join("") + `<th style="width:128px">操作</th>`;
  const tb = document.getElementById("tbody");
  tb.innerHTML = rows.length ? rows.map(t => `
    <tr class="${statusOf(t) === "已完成" ? "" : "undone"}" data-seq="${t.seq}">
      <td class="seq">${t.seq}</td>
      ${vis.map(c => cellHtml(t, c.key)).join("")}
      <td class="actions">
        <button class="ghost" style="padding:2px 8px;font-size:12px" onclick="openDetail(${t.seq})">详情</button>
        <button class="ghost" style="padding:2px 8px;font-size:12px" onclick="openEdit(${t.seq})">编辑</button>
        <button class="danger-link" onclick="delTask(${t.seq})">删除</button>
      </td>
    </tr>`).join("")
    : `<tr><td colspan="${vis.length + 2}" class="empty-tip">暂无记录，点右上角「＋ 新增任务」开始</td></tr>`;

  const undone = tasks.filter(t => statusOf(t) !== "已完成").length;
  document.getElementById("stats").innerHTML =
    `共 ${tasks.length} 条 · <b class="undone">未解决 ${undone}</b> · 已完成 ${tasks.length - undone}`;
  fillFilter("filterCustomer", "全部客户", [...new Set(tasks.map(t => t.customer).filter(Boolean))].sort());
  fillFilter("filterHandler", "全部处理人", [...new Set(tasks.map(t => t.handler).filter(Boolean))]);
  bindInlineEdit();
  refreshCustomerList();
  refreshHandlerList();
}

    case "city": return `<td${ed("city")}>${esc(g.city) || dash}</td>`;
    case "impl": return `<td${ed("impl")}>${esc(g.impl) || dash}</td>`;

function renderGo() {
  const fm = document.getElementById("goFilterMode").value;
  const kw = document.getElementById("goKw").value.trim().toLowerCase();
  const rows = golive.filter(g => {
    if (fm && g.mode !== fm) return false;

    return true;

  document.getElementById("goTbody").innerHTML = rows.length ? rows.map(g => `
    <tr data-seq="${g.seq}">
      <td class="seq">${g.seq}</td>
      ${GOCOLS.map(c => goCellHtml(g, c.key)).join("")}
      <td class="actions">

      </td>
    </tr>`).join("")
    : `<tr><td colspan="${GOCOLS.length + 2}" class="empty-tip">暂无上线记录，可「＋ 新增上线记录」或「📥 导入 Excel」历史数据</td></tr>`;
  document.getElementById("goStats").textContent = `共 ${golive.length} 条上线记录`;
  fillFilter("goFilterMode", "全部直联模式", MODES);
  bindInlineEdit();
}

function nextGoSeq() { return golive.reduce((m, g) => Math.max(m, g.seq), 0) + 1; }
let goEditingId = null;

function openGoEdit(seq) {
  goEditingId = seq || null;
  const g = seq ? golive.find(x => x.seq === seq) : null;
  document.getElementById("goEditTitle").textContent = g ? `编辑上线记录 #${g.seq}` : "新增上线记录";
  document.getElementById("gEnt").value = g?.ent || "";
  document.getElementById("gBank").value = g?.bank || "";
  document.getElementById("gMode").innerHTML = `<option value=""></option>` + MODES.map(m => `<option${g?.mode === m ? " selected" : ""}>${m}</option>`).join("");
  document.getElementById("gDate").value = g?.date || "";
  document.getElementById("gCity").value = g?.city || "";
  document.getElementById("gImpl").value = g?.impl || "";
  document.getElementById("gMgr").value = g?.mgr || "";
  document.getElementById("goMask").classList.add("show");
}
function closeGoEdit() { document.getElementById("goMask").classList.remove("show"); }

function saveGoEdit() {
  const ent = document.getElementById("gEnt").value.trim();
  if (!ent) return alert("企业名称为必填项");
  const data = {
    ent,
    bank: document.getElementById("gBank").value.trim(),
    mode: document.getElementById("gMode").value,
    date: document.getElementById("gDate").value || "",
    city: document.getElementById("gCity").value.trim(),
    impl: document.getElementById("gImpl").value.trim(),
    mgr: document.getElementById("gMgr").value.trim(),
  };
  if (goEditingId) Object.assign(golive.find(g => g.seq === goEditingId), data);
  else golive.push({ seq: nextGoSeq(), ...data });
  golive.sort((a, b) => a.seq - b.seq);
  saveLocal(); render(); closeGoEdit();
}

function delGo(seq) {
  const g = golive.find(x => x.seq === seq);
  if (!confirm(`确定删除上线记录 #${seq}？\n${g.ent}${g.bank ? " · " + g.bank : ""}`)) return;
  golive = golive.filter(x => x.seq !== seq);
  saveLocal(); render();
}

/* ---------- Excel 导入上线记录 ---------- */
let xlsxLoading = false;
function importGoExcel(input) {
  const file = input.files[0];
  input.value = "";
  if (!file) return;
  if (window.XLSX) return doGoImport(file);
  if (xlsxLoading) return;
  xlsxLoading = true;
  setSync("", "正在加载 Excel 解析库（首次需联网）…");
  const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
  s.onload = () => doGoImport(file);
  s.onerror = () => { xlsxLoading = false; alert("Excel 解析库加载失败，请检查网络后重试"); };
  document.head.appendChild(s);
}

function fmtDate(d) {
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
/* 单元格值规范化：Date→YYYY-MM-DD，Excel日期序列号→日期，其余转字符串 */
function normGoVal(v) {
  if (v instanceof Date && !isNaN(v)) return fmtDate(v);
  if (typeof v === "number" && v > 20000 && v < 80000) {
    const d = new Date(Math.round((v - 25569) * 86400000));
    return fmtDate(new Date(d.getTime() + d.getTimezoneOffset() * 60000));
  }
  return String(v ?? "").trim();
}

async function doGoImport(file) {
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { cellDates: true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval: "" });
    if (!rows.length) return alert("Excel 第一个 sheet 没有读到数据行");
    const keys = Object.keys(rows[0]).map(k => ({ raw: k, name: String(k).trim() }));
    const alias = {
      seq:  ["序号"],
      ent:  ["企业名称", "企业", "客户名称", "单位名称", "企业名"],
      bank: ["银行名称", "银行", "开户银行", "上线银行"],
      mode: ["直联模式", "接入模式", "对接模式", "模式"],
      date: ["上线日期", "上线时间", "日期"],
      city: ["城市", "所在地", "所在城市"],
      impl: ["实施人员", "实施", "实施人", "实施负责人"],
      mgr:  ["客户经理", "客户经理姓名", "经理"],
    };
    const col = {};
    for (const [f, list] of Object.entries(alias)) {
      const hit = keys.find(k => list.includes(k.name)) || keys.find(k => list.some(x => k.name.includes(x)));
      col[f] = hit ? hit.raw : null;
    }
    if (!col.ent && !col.bank) {
      return alert("没有识别到「企业名称」或「银行名称」列。\n表头有：" + keys.map(k => k.name).join("、"));
    }
    const get = (r, f) => col[f] ? normGoVal(r[col[f]]) : "";
    const exist = new Set(golive.map(g => [g.ent, g.bank, g.mode, g.date].join("|")));
    let maxSeq = golive.reduce((m, g) => Math.max(m, g.seq), 0);
    let added = 0, skipped = 0;
    rows.forEach(r => {
      const rec = {
        seq: parseInt(get(r, "seq")) || 0,
        ent: get(r, "ent"), bank: get(r, "bank"), mode: get(r, "mode"),
        date: get(r, "date"), city: get(r, "city"), impl: get(r, "impl"), mgr: get(r, "mgr"),
      };
      if (!rec.ent && !rec.bank) { skipped++; return; }
      const key = [rec.ent, rec.bank, rec.mode, rec.date].join("|");
      if (exist.has(key)) { skipped++; return; }
      exist.add(key);
      if (!rec.seq) rec.seq = ++maxSeq;
      golive.push(rec); added++;
    });
    golive.sort((a, b) => a.seq - b.seq);
    saveLocal(); render();
    alert(`导入完成：新增 ${added} 条，跳过（重复/空行）${skipped} 条\n使用列：${Object.entries(col).filter(([, v]) => v).map(([f, v]) => f + "←" + v).join("，")}`);
  } catch (e) { alert("导入失败：" + e.message); }
}

function exportGoCsv() {
  const head = ["序号", "企业名称", "银行名称", "直联模式", "上线日期", "城市", "实施人员", "客户经理"];
  const lines = [head];
  golive.forEach(g => lines.push([g.seq, g.ent, g.bank, g.mode, g.date, g.city, g.impl, g.mgr]));
  const csv = "\uFEFF" + lines.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  download(`客户上线记录_${new Date().toISOString().slice(0, 10)}.csv`, csv, "text/csv;charset=utf-8");
}

function catBadge(c) {
  const i = KB_CATS.indexOf(c);
  return `<span class="badge k${i >= 0 ? i + 1 : 2}">${esc(c)}</span>`;
}

function kbCellHtml(g, key) {
  const dash = '<span style="color:var(--muted)">—</span>';

    case "title":   return `<td${ed("title")}><b>${esc(g.title) || dash}</b></td>`;

    case "note":    return `<td${ed("note")}>${esc(g.note) || dash}</td>`;

  return "<td></td>";
}

function renderKb() {
  const fc = document.getElementById("kbFilterCat").value;
  const kw = document.getElementById("kbKw").value.trim().toLowerCase();
  const rows = kb.filter(g => {
    if (fc && g.cat !== fc) return false;
    if (kw && ![g.title, g.content, g.note].join(" ").toLowerCase().includes(kw)) return false;
    return true;
  });
  const KBCOLS = [
    { key: "cat",     label: "分类",       w: "width:110px" },
    { key: "title",   label: "标题/问题",  w: "min-width:200px" },
    { key: "content", label: "内容/办法",  w: "min-width:320px" },
    { key: "date",    label: "记录日期",   w: "width:100px" },
    { key: "note",    label: "备注",       w: "width:130px" },
  ];
  document.getElementById("kbTheadRow").innerHTML =
    `<th style="width:46px">序号</th>` + KBCOLS.map(c => `<th style="${c.w}">${c.label}</th>`).join("") + `<th style="width:118px">操作</th>`;
  document.getElementById("kbTbody").innerHTML = rows.length ? rows.map(g => `
    <tr data-seq="${g.seq}">
      <td class="seq">${g.seq}</td>
      ${KBCOLS.map(c => kbCellHtml(g, c.key)).join("")}
      <td class="actions">
        <button class="ghost" style="padding:2px 8px;font-size:12px" onclick="openKbView(${g.seq})">详情</button>
        <button class="ghost" style="padding:2px 8px;font-size:12px" onclick="openKbEdit(${g.seq})">编辑</button>
        <button class="danger-link" onclick="delKb(${g.seq})">删除</button>
      </td>
    </tr>`).join("")
    : `<tr><td colspan="${KBCOLS.length + 2}" class="empty-tip">暂无知识条目，点「＋ 新增知识条目」沉淀第一条</td></tr>`;
  const faq = kb.filter(g => g.cat === "云跨行FAQ").length;

function nextKbSeq() { return kb.reduce((m, g) => Math.max(m, g.seq), 0) + 1; }
let kbEditingId = null;

function saveKbEdit() {

}

function delKb(seq) {
  const g = kb.find(x => x.seq === seq);

/* 双击行内编辑 */
function bindInlineEdit() {
  document.querySelectorAll("td.editable").forEach(td => {
    td.ondblclick = () => {
      const seq = +td.closest("tr").dataset.seq;
      const field = td.dataset.field;
      const task = D().find(t => t.seq === seq);
      if (!task) return;
      /* 状态列特殊处理：双击直接切换 */
      if (field === "status") {
        const ns = statusOf(task) === "已完成" ? "未解决" : "已完成";
        task.status = ns;
        if (ns === "已完成" && !task.solvedDate) task.solvedDate = new Date().toISOString().slice(0, 10);
        if (ns === "未解决") task.solvedDate = "";
        saveLocal(); render();
        return;
      }
      const old = task[field] || "";
      td.innerHTML = `<textarea class="inline-input" rows="${Math.max(2, old.split("\n").length)}">${esc(old)}</textarea>`;
      const ta = td.querySelector("textarea");
      ta.focus(); ta.select();
      const commit = () => {
        task[field] = ta.value.trim();
        saveLocal(); render();
      };
      ta.onblur = commit;
      ta.onkeydown = e => { if (e.key === "Escape") { ta.onblur = null; render(); } };
    };
  });
}

/* ---------- 新增 / 编辑 ---------- */
function nextSeq() { return tasks.reduce((m, t) => Math.max(m, t.seq), 0) + 1; }

function openEdit(seq) {
  editingId = seq || null;
  const t = seq ? tasks.find(x => x.seq === seq) : null;
  document.getElementById("editTitle").textContent = t ? `编辑任务 #${t.seq}` : "新增任务";
  document.getElementById("fDate").value = t ? t.date : new Date().toISOString().slice(0, 10);
  const sel = document.getElementById("fType");
  sel.innerHTML = TYPES.map(x => `<option>${x}</option>`).join("") + `<option value="__other">自定义…</option>`;
  if (t && !TYPES.includes(t.type)) { sel.value = "__other"; sel.dataset.custom = t.type; }
  else sel.value = t ? t.type : TYPES[0];
  document.getElementById("fCustomer").value = t?.customer || "";
  document.getElementById("fDesc").value = t?.desc || "";
  document.getElementById("fCause").value = t?.cause || "";
  document.getElementById("fSolution").value = t?.solution || "";
  document.getElementById("fSolved").value = t?.solvedDate || "";
  document.getElementById("fStatus").value = statusOf(t);
  document.getElementById("fHandler").value = t?.handler || "";
  document.getElementById("fNote").value = t?.note || "";
  editAtt = {
    desc: [...(t?.att?.desc || [])],
    cause: [...(t?.att?.cause || [])],
    solution: [...(t?.att?.solution || [])],
  };
  renderAttLists();
  document.getElementById("editMask").classList.add("show");
}
function closeEdit() { document.getElementById("editMask").classList.remove("show"); }

function saveEdit() {
  const date = document.getElementById("fDate").value;
  let type = document.getElementById("fType").value;
  if (type === "__other") type = prompt("输入自定义任务类型：") || "";
  const desc = document.getElementById("fDesc").value.trim();
  if (!date || !type || !desc) return alert("提出日期、任务类型、任务描述为必填项");
  let solvedDate = document.getElementById("fSolved").value || "";
  let status = document.getElementById("fStatus").value;
  if (solvedDate && status !== "已完成") status = "已完成";   /* 填了解决日期视为已完成 */
  if (status === "已完成" && !solvedDate) solvedDate = new Date().toISOString().slice(0, 10);
  if (status === "未解决") solvedDate = "";
  const data = {
    date, type,
    customer: document.getElementById("fCustomer").value.trim(),
    desc,
    cause: document.getElementById("fCause").value.trim(),
    solution: document.getElementById("fSolution").value.trim(),
    solvedDate,
    status,
    att: editAtt,
    handler: document.getElementById("fHandler").value.trim(),
    note: document.getElementById("fNote").value.trim(),
  };
  if (editingId) {
    Object.assign(tasks.find(t => t.seq === editingId), data);
  } else {
    tasks.push({ seq: nextSeq(), ...data });
  }
  tasks.sort((a, b) => a.seq - b.seq);
  saveLocal(); render(); closeEdit();
  if (cfg().autoPush) pushToGitHub();
}

function delTask(seq) {
  const t = tasks.find(x => x.seq === seq);
  if (!confirm(`确定删除任务 #${seq}？\n${t.desc.slice(0, 40)}…`)) return;
  tasks = tasks.filter(x => x.seq !== seq);
  saveLocal(); render();
}

function renderViewAtt(list) {
  return list.map((a, i) => a.mime && a.mime.startsWith("image/")
    ? `<img src="${a.data}" title="${esc(a.name)}" onclick="showLightbox(this.src)">`
    : `<span class="att-chip"><a href="${a.data}" download="${esc(a.name)}">📄 ${esc(a.name)}</a></span>`
  ).join("");
}
function closeView() { document.getElementById("viewMask").classList.remove("show"); }
function showLightbox(src) { document.getElementById("lightboxImg").src = src; document.getElementById("lightbox").classList.add("show"); }

/* ---------- 附件（截图/文件，内嵌存储，随数据同步） ---------- */
const ATT_FIELDS = ["desc", "cause", "solution"];
const ATT_MAX = 600 * 1024;  // 单个文件上限 600KB（截图压缩后一般 100~200KB）
let editAtt = { desc: [], cause: [], solution: [] };

function pickAtt(field) { document.getElementById("attFile-" + field).click(); }

function addAtt(field, input) {
  const files = [...input.files];
  input.value = "";
  files.forEach(async f => {
    try {
      let data;
      if (f.type.startsWith("image/")) {
        data = await compressImage(f);
      } else {
        if (f.size > ATT_MAX) return alert(`「${f.name}」超过 600KB，已跳过（截图会自动压缩，非图片文件请控制在 600KB 内）`);
        data = await new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = () => res(r.result); r.onerror = rej;
          r.readAsDataURL(f);
        });
      }
      if (data.length > ATT_MAX * 1.4) return alert(`「${f.name}」压缩后仍较大，已跳过`);
      editAtt[field].push({ name: f.name, mime: f.type || "application/octet-stream", data });
      renderAttLists();
    } catch { alert(`「${f.name}」读取失败，已跳过`); }
  });
}

/* 截图压缩：长边压到 1200px，JPEG 质量 0.65；小图保持原样 */
function compressImage(file) {
  return new Promise((res, rej) => {
    if (file.size < 80 * 1024) {  // 小于 80KB 直接原样存（保留 PNG 透明度）
      const r = new FileReader();
      r.onload = () => res(r.result); r.onerror = rej;
      r.readAsDataURL(file);
      return;
    }
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1200;
      let w = img.width, h = img.height;
      if (w > max) { h = Math.round(h * max / w); w = max; }
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      const out = cv.toDataURL("image/jpeg", 0.65);
      URL.revokeObjectURL(url);
      res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

function removeAtt(field, idx) { editAtt[field].splice(idx, 1); renderAttLists(); }

function renderAttLists() {
  ATT_FIELDS.forEach(f => {
    document.getElementById("attList-" + f).innerHTML = editAtt[f].map((a, i) => `
      <span class="att-chip">
        ${a.mime.startsWith("image/") ? `<img src="${a.data}" onclick="showLightbox(this.src)">` : "📄"}
        <span class="name" title="${esc(a.name)}">${esc(a.name)}</span>
        <button type="button" class="rm" onclick="removeAtt('${f}', ${i})" title="移除">✕</button>
      </span>`).join("");
  });
}

/* ---------- 导入导出 ---------- */
function download(name, content, mime) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], { type: mime }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
function exportCsv() {
  const head = ["序号", "任务提出日期", "任务类型", "客户名称", "任务描述", "问题原因", "解决方案", "解决日期", "任务状态", "处理人", "备注"];
  const lines = [head];
  tasks.forEach(t => lines.push([t.seq, t.date, t.type, t.customer, t.desc, t.cause, t.solution, t.solvedDate, statusOf(t), t.handler, t.note]));
  const csv = "\uFEFF" + lines.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  download(`工作任务记录_${new Date().toISOString().slice(0, 10)}.csv`, csv, "text/csv;charset=utf-8");
}
function exportJson() {
  download(`worklog_backup_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(tasks, null, 2), "application/json");
}
function importJson(input) {
  const file = input.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const arr = JSON.parse(r.result);
      if (!Array.isArray(arr)) throw new Error("格式不对");
      const seqs = new Set(tasks.map(t => t.seq));
      let added = 0;
      arr.forEach(t => { if (!seqs.has(t.seq)) { tasks.push(t); added++; } });
      tasks.sort((a, b) => a.seq - b.seq);
      saveLocal(); render();
      alert(`导入完成，新增 ${added} 条`);
    } catch (e) { alert("导入失败：" + e.message); }
  };
  r.readAsText(file, "utf-8");
  input.value = "";
}
